<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salı Akşamı Kurası</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap">
<style>
:root{--bg:#eceae5;--sf:#fff;--tx:#1d2124;--mu:#5d656b;--ln:#cfccc4;--t:#b7791f;--ct:#2b6cb0;--ac:#1d2124;--ac-tx:#fff;--bad:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181a;--sf:#202427;--tx:#e8e6e1;--mu:#8b9298;--ln:#343a3e;--t:#e0a43a;--ct:#5b9bd5;--ac:#e8e6e1;--ac-tx:#16181a;--bad:#f2837b}}
:root[data-theme="dark"]{--bg:#16181a;--sf:#202427;--tx:#e8e6e1;--mu:#8b9298;--ln:#343a3e;--t:#e0a43a;--ct:#5b9bd5;--ac:#e8e6e1;--ac-tx:#16181a;--bad:#f2837b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 Barlow,system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:28px 18px 48px}
h1{font:800 clamp(34px,8vw,56px)/1 "Barlow Condensed",Impact,sans-serif;margin:0 0 6px}
.sub{color:var(--mu);margin:0 0 26px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:16px}
.bill{margin-top:18px}
h2{font:600 22px/1.1 "Barlow Condensed",sans-serif;margin:0 0 12px}
.add{display:flex;gap:8px}
input[type=text],input[type=number]{font:inherit;padding:10px 12px;border:1px solid var(--ln);border-radius:4px;background:var(--bg);color:var(--tx)}
input[type=text]{flex:1;min-width:0}
input[type=number]{width:70px}
button{font:600 16px Barlow,sans-serif;cursor:pointer;border:0;border-radius:4px;padding:10px 16px;background:var(--ac);color:var(--ac-tx)}
button.ghost{background:transparent;color:var(--mu);border:1px solid var(--ln)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--ct);outline-offset:2px}
ul{list-style:none;margin:14px 0 0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--ln)}
li .n{flex:1;overflow-wrap:anywhere}
li .pt{font:800 22px "Barlow Condensed",sans-serif;min-width:34px;text-align:right}
.x{padding:2px 9px;background:transparent;color:var(--mu);font-size:20px}
.hint{color:var(--mu);font-size:14px;margin:10px 0 0}
.count{color:var(--mu);font-weight:400;font-size:16px}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.actions .go{flex:1;font:800 22px "Barlow Condensed",sans-serif;padding:12px;letter-spacing:.03em}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.team{border-top:6px solid var(--c);background:var(--bg);border-radius:4px;padding:12px;min-height:180px}
.team.t{--c:var(--t)}.team.ct{--c:var(--ct)}
.team h3{font:800 28px/1 "Barlow Condensed",sans-serif;margin:0 0 8px;color:var(--c)}
.team div.p{font:600 20px/1.3 Barlow,sans-serif;padding:5px 0;border-top:1px solid var(--ln);animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateX(-10px)}}
@media (prefers-reduced-motion:reduce){.team div.p{animation:none}}
.empty{color:var(--mu);padding:30px 6px;text-align:center}
.win{flex:1;color:#fff}
.win.t{background:#9a6412}.win.ct{background:#245d99}
.g{padding:6px 12px;margin:0 6px 6px 0}
.g.on{background:var(--ac);color:var(--ac-tx);border-color:var(--ac)}
.detail{border:1px solid var(--ln);border-radius:4px;padding:6px 12px;margin-top:6px;background:var(--bg)}
.dl{margin:6px 0}.dl.t b{color:var(--t)}.dl.ct b{color:var(--ct)}
.payers{margin:12px 0 0;font:600 22px/1.4 Barlow,sans-serif}
.payers b{color:var(--bad);font-weight:800}
</style>
</head>
<body>
<main>
<h1>Salı akşamı kurası</h1>
<p class="sub">İsimleri yaz, takımlar tek tuşla çıksın. Kazanan takıma 3 puan yaz, gece sonunda en az puanlılar hesabı ödesin.</p>
<div class="grid">
  <section class="card">
    <h2>Puan durumu <span class="count" id="count"></span></h2>
    <div class="add">
      <input type="text" id="name" placeholder="İsim yaz, Enter’a bas" maxlength="24" autocomplete="off" aria-label="Oyuncu adı">
      <button id="addBtn">Ekle</button>
    </div>
    <ul id="list"></ul>
    <h2 style="margin-top:22px">Oynanan maçlar</h2>
    <div id="games"></div>
    <div id="detail"></div>
    <div class="actions"><button class="ghost" id="clear">Listeyi temizle</button></div>
  </section>
  <section class="card">
    <h2>Takımlar</h2>
    <div id="out"><p class="empty">En az 2 oyuncu ekle, sonra kurayı çek.</p></div>
    <div class="actions" id="res" hidden>
      <button class="win t" id="wT">Terörist kazandı +3</button>
      <button class="win ct" id="wCT">Anti-Terör kazandı +3</button>
    </div>
    <div class="actions"><button class="go" id="draw">Kurayı çek</button></div>
    <p class="hint" id="info" role="status"></p>
  </section>
</div>
<section class="card bill">
  <h2>Hesap kimden? <span class="count" id="rc"></span></h2>
  <div class="actions" style="margin-top:0">
    <label for="k">Ödeyecek kişi sayısı</label>
    <input type="number" id="k" min="1" max="20" value="4">
    <button id="pay">Hesabı kim ödüyor?</button>
    <button class="ghost" id="undo">Son maçı geri al</button>
    <button class="ghost" id="reset">Geceyi sıfırla</button>
  </div>
  <div id="billOut" role="status"></div>
</section>
</main>
<script>
(function(){
var players=[],rounds=[],last='',timers=[],cur=null,done=true,rt=null,sel=-1;
var $=function(i){return document.getElementById(i)};
try{var s=JSON.parse(localStorage.getItem('cs-players2')||'[]');if(Array.isArray(s))players=s.filter(function(p){return p&&typeof p.n==='string'}).slice(0,20).map(function(p){return{n:p.n}});
var r=JSON.parse(localStorage.getItem('cs-rounds')||'[]');if(Array.isArray(r))rounds=r.filter(function(x){return x&&Array.isArray(x.w)})}catch(e){}
function save(){try{localStorage.setItem('cs-players2',JSON.stringify(players));localStorage.setItem('cs-rounds',JSON.stringify(rounds))}catch(e){}}
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
function pts(n){return rounds.filter(function(r){return r.w.indexOf(n)>-1}).length*3}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function render(){
  $('count').textContent='('+players.length+')';
  $('rc').textContent=rounds.length?'('+rounds.length+' maç oynandı)':'';
  var order=players.map(function(p,i){return{i:i,n:p.n,p:pts(p.n)}}).sort(function(a,b){return b.p-a.p});
  $('list').innerHTML=order.map(function(o){
    return '<li><span class="n">'+esc(o.n)+'</span><span class="pt" title="Puan">'+o.p+'</span><button class="x" data-r="'+o.i+'" aria-label="'+esc(o.n)+' sil">×</button></li>';
  }).join('');
  $('undo').disabled=!rounds.length;
  renderGames();
}
function renderGames(){
  var g=$('games'),d=$('detail');
  if(!rounds.length){g.innerHTML='<p class="hint">Henüz oynanan maç yok.</p>';d.innerHTML='';return}
  g.innerHTML=rounds.map(function(r,i){return '<button class="ghost g'+(i===sel?' on':'')+'" data-g="'+i+'" aria-pressed="'+(i===sel)+'">'+(r.n||i+1)+'. Oyun</button>'}).join('');
  var r=rounds[sel];
  if(!r){d.innerHTML='';return}
  function line(l,c,arr,w){return '<p class="dl '+c+'"><b>'+l+(w?' (kazandı)':'')+'</b>: '+arr.map(esc).join(', ')+'</p>'}
  d.innerHTML='<div class="detail">'+(Array.isArray(r.T)&&Array.isArray(r.CT)?line('Terörist','t',r.T,r.s==='T')+line('Anti-Terör','ct',r.CT,r.s==='CT'):line('Kazanan kadro',r.s==='CT'?'ct':'t',r.w,false))+'</div>';
}
function add(){
  var v=$('name').value.trim();if(!v)return;
  if(players.some(function(p){return p.n.toLowerCase()===v.toLowerCase()})){$('info').textContent='Bu isim zaten listede.';return}
  if(players.length>=20){$('info').textContent='En fazla 20 oyuncu eklenebilir.';return}
  players.push({n:v});$('name').value='';$('info').textContent='';save();render();$('name').focus();
}
$('addBtn').onclick=add;
$('name').onkeydown=function(e){if(e.key==='Enter')add()};
$('list').onclick=function(e){var r=e.target.getAttribute('data-r');if(r!==null){players.splice(+r,1);save();render()}};
$('clear').onclick=function(){players=[];rounds=[];sel=-1;last='';cur=null;save();render();$('res').hidden=true;$('billOut').innerHTML='';$('out').innerHTML='<p class="empty">En az 2 oyuncu ekle, sonra kurayı çek.</p>';$('info').textContent=''};
function key(a,b){var f=function(x){return x.slice().sort().join('|')};var A=f(a),B=f(b);return A<B?A+'//'+B:B+'//'+A}
function tk(a){return a.slice().sort().join('|')}
function hist(){return rounds.filter(function(r){return Array.isArray(r.T)&&Array.isArray(r.CT)})}
function side(r,p){return r.T.indexOf(p)>-1?'T':r.CT.indexOf(p)>-1?'CT':''}
function viol(T,CT,H){
  var v=0,n=H.length;
  if(n>=2){
    var h1=H[n-1],h2=H[n-2];
    T.forEach(function(p){if(side(h1,p)==='T'&&side(h2,p)==='T')v++});
    CT.forEach(function(p){if(side(h1,p)==='CT'&&side(h2,p)==='CT')v++});
    [h1.T,h1.CT].forEach(function(A){[h2.T,h2.CT].forEach(function(B){
      var c=A.filter(function(p){return B.indexOf(p)>-1});
      if(c.length>=3)[T,CT].forEach(function(tm){if(tm.filter(function(p){return c.indexOf(p)>-1}).length>=3)v++});
    })});
  }
  var ks=[];H.slice(-3).forEach(function(r){ks.push(tk(r.T),tk(r.CT))});
  if(ks.indexOf(tk(T))>-1)v++;
  if(ks.indexOf(tk(CT))>-1)v++;
  return v;
}
function draw(){
  if(players.length<2){$('info').textContent='Kura için en az 2 oyuncu gerekli.';return}
  var H=hist(),half=Math.floor(players.length/2),names=players.map(function(p){return p.n}),best=null,bv=1e9,i;
  for(i=0;i<500&&bv>0;i++){
    var sh=shuffle(names),a=sh.slice(0,half),b=sh.slice(half);
    [[a,b],[b,a]].forEach(function(o){
      var v=viol(o[0],o[1],H)+(key(o[0],o[1])===last?1:0);
      if(v<bv||(v===bv&&Math.random()<.5)){bv=v;best=o}
    });
  }
  last=key(best[0],best[1]);
  cur={T:best[0],CT:best[1]};done=false;
  show();
  if(bv>0)$('info').textContent='Kuralların hepsi sağlanamadı, en uygun dağılım seçildi.';
}
function show(){
  timers.forEach(clearTimeout);timers=[];
  function col(cls,title){return '<div class="team '+cls+'"><h3>'+title+'</h3><div class="body"></div></div>'}
  $('out').innerHTML='<div class="teams">'+col('t','Terörist')+col('ct','Anti-Terör')+'</div>';
  var bodies=document.querySelectorAll('.team .body');
  [cur.T,cur.CT].forEach(function(arr,ti){
    arr.forEach(function(n,k){
      timers.push(setTimeout(function(){var e=document.createElement('div');e.className='p';e.textContent=n;bodies[ti].appendChild(e)},(k*2+ti)*280));
    });
  });
  $('res').hidden=false;$('wT').disabled=false;$('wCT').disabled=false;
  $('info').textContent=players.length%2?'Oyuncu sayısı tek, bir takım bir kişi fazla.':'';
  $('draw').textContent='Tekrar çek';
}
function win(side){
  if(!cur||done)return;
  done=true;
  rounds.push({n:rounds.length+1,w:cur[side].slice(),s:side,T:cur.T.slice(),CT:cur.CT.slice()});save();render();
  $('wT').disabled=true;$('wCT').disabled=true;
  $('info').textContent=(side==='T'?'Terörist':'Anti-Terör')+' takımının her oyuncusuna 3 puan yazıldı.';
}
$('wT').onclick=function(){win('T')};
$('wCT').onclick=function(){win('CT')};
$('draw').onclick=draw;
$('games').onclick=function(e){var b=e.target.closest('button[data-g]');if(!b)return;var i=+b.getAttribute('data-g');sel=(sel===i)?-1:i;renderGames()};
$('undo').onclick=function(){
  if(!rounds.length)return;
  var r=rounds.pop();if(sel>=rounds.length)sel=-1;save();render();
  if(cur&&done&&r.s){done=false;$('wT').disabled=false;$('wCT').disabled=false}
  $('billOut').innerHTML='';$('info').textContent='Son maç geri alındı.';
};
$('reset').onclick=function(){
  var b=$('reset');
  if(!rt){b.textContent='Emin misin? Tekrar bas';rt=setTimeout(function(){b.textContent='Geceyi sıfırla';rt=null},3000);return}
  clearTimeout(rt);rt=null;b.textContent='Geceyi sıfırla';
  rounds=[];sel=-1;last='';try{localStorage.removeItem('cs-rounds')}catch(e){}save();render();$('billOut').innerHTML='';$('info').textContent='Puanlar ve maç geçmişi sıfırlandı.';
};
$('pay').onclick=function(){
  var out=$('billOut');
  if(players.length<2){out.innerHTML='<p class="hint">Önce oyuncuları ekle.</p>';return}
  if(!rounds.length){out.innerHTML='<p class="hint">Henüz kayıtlı maç yok. Önce kazanan takımı işaretle.</p>';return}
  var k=Math.max(1,Math.min(players.length,parseInt($('k').value,10)||4));
  var arr=shuffle(players.map(function(p){return{n:p.n,p:pts(p.n)}})).sort(function(a,b){return a.p-b.p});
  var pay=arr.slice(0,k),cut=pay[k-1].p;
  var tied=arr.filter(function(x){return x.p===cut}),tie=arr.slice(k).some(function(x){return x.p===cut});
  var h='<p class="payers">Hesabı ödeyenler: '+pay.map(function(x){return '<b>'+esc(x.n)+'</b> ('+x.p+')'}).join(', ')+'</p>';
  if(tie)h+='<p class="hint">'+tied.map(function(x){return esc(x.n)}).join(', ')+' aynı puandaydı, aralarından kura ile seçildi.</p>';
  out.innerHTML=h;
};
render();
})();
</script>
</body>
</html>
